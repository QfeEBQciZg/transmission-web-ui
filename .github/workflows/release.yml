name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.0)'
        required: false
        type: string
      draft:
        description: 'Create a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test

      - name: Build static distribution
        run: npm run build

      - name: Package artifacts
        run: |
          mkdir -p release-artifacts
          # Package tar.gz (directly bundling contents of dist/)
          tar -czf release-artifacts/transmission-web-ui-dist.tar.gz -C dist .
          # Package zip
          (cd dist && zip -r ../release-artifacts/transmission-web-ui-dist.zip .)
          # Generate SHA256 checksums
          (cd release-artifacts && sha256sum transmission-web-ui-dist.tar.gz transmission-web-ui-dist.zip > sha256sums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-artifacts/transmission-web-ui-dist.tar.gz
            release-artifacts/transmission-web-ui-dist.zip
            release-artifacts/sha256sums.txt
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
